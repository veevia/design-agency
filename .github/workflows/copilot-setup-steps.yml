name: Copilot Setup Steps

# Prepares the environment for the Copilot coding agent; the job name must stay `copilot-setup-steps`.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - 06_Engine/requirements.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - 06_Engine/requirements.txt

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness dependencies
        run: python -m pip install -r 06_Engine/requirements.txt

      - name: Confirm the OS review runs
        run: python 00_Agentic-OS/agentic-os-review.py --fast
